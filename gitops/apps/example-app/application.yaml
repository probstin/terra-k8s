apiVersion: argoproj.io/v1alpha1
kind: Application
metadata:
  name: example-app
  namespace: argocd
  # Prune this app's resources (incl. its ExternalSecret) when the Application
  # is deleted, rather than orphaning them after ArgoCD is gone.
  finalizers:
    - resources-finalizer.argocd.argoproj.io
spec:
  project: default
  source:
    repoURL: https://github.com/probstin/terra-k8s.git
    targetRevision: main
    path: gitops/apps/example-app/manifests
  destination:
    server: https://kubernetes.default.svc
    namespace: example-app
  syncPolicy:
    automated:
      prune: true
      selfHeal: true
    syncOptions:
      - CreateNamespace=true
